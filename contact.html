<html lang="fr">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DH-Shop | Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-bag-shopping"></i> E-Shop<span>Store</span></a>
            <button class="menu-toggle" id="mobile-menu" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>

            <nav class="nav-links" id="nav-links">
                <a href="index.html">Accueil</a>
                <a href="produits.html">Produits</a>
                <a href="apropos.html">À Propos</a>
                <a href="contact.html" class="active">Contact</a>
                <button id="cartBtn" class="cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Panier</span>
                    <span id="cartCount" class="cart-badge">0</span>
                </button>
            </nav>
        </div>
    </header>

    <div class="page-header">
        <h1>Contactez-nous</h1>
        <p>Une question sur une commande ou un produit ? Envoyez-nous un message.</p>
    </div>

    <section class="section">
        <div class="container">
            <div class="contact-wrapper">
                <form id="contactForm" class="contact-form">
                    <div class="form-group">
                        <label for="nom">Nom complet</label>
                        <input type="text" id="nom" required placeholder="Ex: Jean Dupont">
                    </div>
                    <div class="form-group">
                        <label for="email">Adresse Email</label>
                        <input type="email" id="email" required placeholder="Ex: jean.dupont@email.com">
                    </div>
                    <div class="form-group">
                        <label for="message">Votre Message</label>
                        <textarea id="message" rows="5" required placeholder="Votre message..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Envoyer le message</button>
                    <div id="formStatus" class="form-status"></div>
                </form>
            </div>
        </div>
    </section>

    <!-- Modal Panier -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Votre Panier</h2>
                <span id="closeModal" class="close">&times;</span>
            </div>
            <div id="cartItems" class="cart-items"></div>
            <div class="cart-summary">
                <h3>Total : <span id="cartTotal">0.00</span> €</h3>
                <button id="checkoutBtn" class="btn btn-primary btn-block">Commander</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container footer-content">
            <p>&copy; 2026 E-ShopStore - Tous droits réservés.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
